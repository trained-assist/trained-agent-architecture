name: Continuous development controller
on:
  pull_request:
    paths:
      - 'tools/continuous-dev/**'
      - '.github/workflows/continuous-development.yml'
  push:
    branches: [main]
    paths:
      - 'tools/continuous-dev/**'
      - '.github/workflows/continuous-development.yml'
permissions:
  contents: read
jobs:
  controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tools/continuous-dev -p 'test_*.py' -v
