name: Feature promotion Gate B

on:
  workflow_dispatch:
    inputs:
      architecture_pr:
        description: Open architecture PR number (Gate A must already pass)
        required: true
        type: number
      manifest_path:
        description: Feature manifest path inside the architecture PR
        required: true
        type: string
  repository_dispatch:
    types: [feature-implementation-merged]

permissions:
  contents: read
  pull-requests: read

jobs:
  gate-b:
    name: feature-promotion / implementation-completion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check linked PRs and pin candidate revisions
        env:
          GH_TOKEN: ${{ secrets.AUTOFIX_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ARCHITECTURE_PR: ${{ inputs.architecture_pr || github.event.client_payload.architecture_pr }}
          MANIFEST_PATH: ${{ inputs.manifest_path || github.event.client_payload.manifest_path }}
        run: node tools/feature-promotion/gate-b.mjs --manifest "$MANIFEST_PATH" --architecture-pr "$ARCHITECTURE_PR"
